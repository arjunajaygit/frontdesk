  /internal/sweep:
    post:
      summary: Machine-authenticated scheduled sweep (external scheduler while the web service sleeps)
      description: SYSTEM actor; same sweep service, leases, fencing and recovery as the in-process scheduler. Uses
        a dedicated bearer credential (SWEEP_TRIGGER_TOKEN); no cookies, Origin or CSRF (not a browser route).
        Disabled (404) unless configured. Idempotency-Key is the deterministic scheduled-slot identity; a retried
        or duplicated delivery replays the stored outcome. No body or clock input is accepted.
      security:
      - machineToken: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{8,120}$
      responses:
        '200':
          description: Success (or replay of the same slot)
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SweepResult'
        '400':
          description: Invalid input
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid machine credential
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Endpoint not configured
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Sweep already in progress
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Sweep failed or lease expired; committed progress preserved
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: frontdesk_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: frontdesk_refresh
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
    machineToken:
      type: http
      scheme: bearer
      description: Dedicated machine credential for /internal/* only; never a user credential.
  schemas:
    Viewer:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum:
          - AGENT
          - LEAD
          - ADMIN
          - CUSTOMER
      required:
      - id
      - displayName
      - role
    PublicMessage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 10000
        authorDisplayName:
          type: string
        authorType:
          type: string
          enum:
          - STAFF
          - CUSTOMER
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - body
      - authorDisplayName
      - authorType
      - createdAt
    StaffMessage:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        body:
          type: string
          minLength: 1
          maxLength: 10000
        author:
          $ref: '#/components/schemas/Viewer'
        kind:
          type: string
          enum:
          - INTAKE
          - REPLY
          - REQUEST
          - NOTE
        visibility:
          type: string
          enum:
          - PUBLIC
          - PRIVATE
        createdAt:
          type: string
          format: date-time
      required:
      - id
      - body
      - author
      - kind
      - visibility
      - createdAt
    PublicTicketSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - WAITING
          - RESOLVED
          - CLOSED
        createdAt:
          type: string
          format: date-time
        parentTicketId:
          type: string
          format: uuid
          nullable: true
      required:
      - id
      - subject
      - status
      - createdAt
      - parentTicketId
    PublicTicket:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
          minLength: 1
          maxLength: 200
        status:
          type: string
          enum:
          - OPEN
          - IN_PROGRESS
          - WAITING
          - RESOLVED
          - CLOSED
        createdAt:
          type: string
          format: date-time
        parentTicketId:
          type: string
          format: uuid
          nullable: true
        messages:
          type: array
          items:
            $ref: '#/components/schemas/PublicMessage'
        olderMessagesCursor:
          type: string
          maxLength: 2048
          nullable: true
          description: Continuation for OLDER messages via the /messages endpoint (null = complete). messages holds the most recent page (at most 50), chronological.
      required:
      - id
      - subject
      - status
      - createdAt
      - parentTicketId
      - messages
      - olderMessagesCursor
    SlaClock:
      type: object
      additionalProperties: false
      properties:
