name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (JavaScript/TypeScript, security-extended)
    # Code scanning on PRIVATE repositories needs GitHub's paid Code Security; on a free private repository the SARIF
    # upload fails. CodeQL is supplementary (Semgrep in security.yml is the mandatory SAST gate), so it runs once the
    # repository is public or the feature is enabled — it is skipped, never faked, while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning (no repository secrets involved)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@ff0a06e83cb2de871e5a09832bc6a81e7276941f # v3.28.18
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with: { category: '/language:javascript-typescript' }
