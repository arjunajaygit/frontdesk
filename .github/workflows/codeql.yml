name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 4 * * 2'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL (JavaScript/TypeScript, security-extended)
    # Code scanning on PRIVATE repositories needs GitHub's paid Code Security; on a free private repository the SARIF
    # upload fails. CodeQL is supplementary (Semgrep in security.yml is the mandatory SAST gate), so it runs once the
    # repository is public or the feature is enabled — it is skipped, never faked, while private.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning (no repository secrets involved)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with: { category: '/language:javascript-typescript' }
