name: Release (manual)

# Final audit H03. Builds, tests, scans, publishes, signs and (optionally) deploys ONE artifact — only for a commit
# on main whose mandatory CI and Security runs passed for that exact SHA (scripts/release-gate.mjs).
# - workflow_dispatch only: fork code can never reach the elevated job permissions below.
# - Jobs that publish/sign/deploy use the protected `release` environment (configure required reviewers and
#   restrict deployment branches to `main` in the repository settings — a remote setting this file cannot enforce).
# - Built ONCE for linux/amd64 (the hosting platform). Local arm64 verification is NOT proof of amd64 behaviour;
#   the amd64 artifact is smoke-tested and scanned here before anything is published.
# - Digests: CONFIG digest (image content id), MANIFEST digest (what the registry serves and what is signed). This
#   workflow builds a single-platform image (no multi-platform index).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character commit SHA to release (must equal the dispatched main commit)
        required: true
        type: string
      publish:
        description: Publish to GHCR, sign and attest (otherwise build, test and scan only)
        required: true
        type: boolean
        default: false
      deploy:
        description: Deploy the signed digest to the hosting platform (requires publish)
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    name: Release gate (approved ref, exact SHA, passing mandatory checks)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc }
      - name: Verify ref, SHA and the CI + Security runs for that SHA
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_SHA: ${{ inputs.sha }}
        run: node scripts/release-gate.mjs gate

  build-test-sign:
    name: Build once (amd64), smoke, scan, SBOM, publish, sign, attest, verify
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>/<repo> (only when publish=true)
      id-token: write # OIDC for keyless signing (only when publish=true)
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    env:
      INPUT_SHA: ${{ inputs.sha }}
      PUBLISH: ${{ inputs.publish }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { ref: '${{ inputs.sha }}', persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Build runtime, migrate and tools images ONCE for linux/amd64
        run: |
          test "$(git rev-parse HEAD)" = "$INPUT_SHA"
          for t in runtime:frontdesk-app migrate:frontdesk-migrate tools:frontdesk-tools; do
            docker buildx build --platform linux/amd64 --target "${t%%:*}" --build-arg GIT_SHA="$INPUT_SHA" --load -t "${t#*:}:local" .
          done
          docker image inspect frontdesk-app:local --format '{{.Id}}' > tested-config-digest.txt
          test "$(docker image inspect frontdesk-app:local --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$INPUT_SHA"
          test "$(docker image inspect frontdesk-app:local --format '{{.Architecture}}')" = "amd64"
          echo "tested config digest: $(cat tested-config-digest.txt)"
      - name: Smoke test the exact artifact (migration job -> restricted app -> explicit seed -> 26 checks)
        run: |
          node scripts/gen-env-prod.mjs
          mkdir -p .local && chmod 777 .local
          C="docker compose -p frontdesk-prod --env-file .env.production.local -f infrastructure/docker/compose.prod.yaml"
          $C up -d --no-build --wait
          $C --profile ops run --rm --user "$(id -u):$(id -g)" seed
          node scripts/smoke-prod.mjs --base http://localhost:8080 --creds .local/credentials.prod-compose.json
          curl -fsS http://localhost:8080/api/healthz | grep -q "\"commit\":\"$INPUT_SHA\""
          $C down -v
      - name: Trivy gate (fixable HIGH/CRITICAL fail) and full report of the exact artifact
        run: |
          T="docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/out aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb"
          $T image --format json --output /out/trivy-report.json --scanners vuln,secret,misconfig --no-progress frontdesk-app:local
          $T image --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --no-progress frontdesk-app:local
          $T image --format cyclonedx --output /out/sbom-image.cdx.json --no-progress frontdesk-app:local
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.publish
        with: { cosign-release: v3.1.4 }
      - name: Publish the tested image; verify the registry copy is the tested artifact
        id: publish
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          IMAGE="ghcr.io/${REPO,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag frontdesk-app:local "$IMAGE:$INPUT_SHA"
          docker push "$IMAGE:$INPUT_SHA"
          REF="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$INPUT_SHA")"
          docker image rm "$IMAGE:$INPUT_SHA" frontdesk-app:local
          docker pull "$REF"
          node scripts/release-gate.mjs digest "$(cat tested-config-digest.txt)" "$(docker image inspect "$REF" --format '{{.Id}}')"
          echo "$REF" > digest-ref.txt
          echo "digest=${REF#*@}" >> "$GITHUB_OUTPUT"
      - name: Keyless sign + SBOM attestation by digest; verify against this workflow's exact identity
        if: inputs.publish
        run: |
          REF="$(cat digest-ref.txt)"
          ID="$(node -e "import('./scripts/release-gate.mjs').then(m => console.log(m.expectedSigningIdentity(process.env.REPO, process.env.GITHUB_REF)))")"
          cosign sign --yes "$REF"
          cosign attest --yes --type cyclonedx --predicate sbom-image.cdx.json "$REF"
          cosign verify --certificate-identity "$ID" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" > /dev/null
          cosign verify-attestation --type cyclonedx --certificate-identity "$ID" --certificate-oidc-issuer https://token.actions.githubusercontent.com "$REF" > /dev/null
          echo "signed and verified: $REF"
      - name: Provenance record
        if: always()
        run: |
          {
            echo "source_sha=$INPUT_SHA"
            echo "platform=linux/amd64"
            echo "config_digest=$(cat tested-config-digest.txt 2>/dev/null)"
            echo "manifest_ref=$(cat digest-ref.txt 2>/dev/null)"
            echo "published=$PUBLISH"
          } > provenance.txt
          cat provenance.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: release-evidence
          path: |
            provenance.txt
            trivy-report.json
            sbom-image.cdx.json
          if-no-files-found: ignore
          retention-days: 90

  deploy:
    name: Deploy the signed digest (hosting platform pulls this exact image)
    needs: build-test-sign
    if: inputs.publish && inputs.deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    env:
      DIGEST: ${{ needs.build-test-sign.outputs.digest }}
      REPO: ${{ github.repository }}
    steps:
      - name: Trigger the image-backed deploy by digest
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          IMAGE="ghcr.io/${REPO,,}@$DIGEST"
          curl -fsS -X POST --get --data-urlencode "imgURL=$IMAGE" "$DEPLOY_HOOK" > /dev/null
          echo "deploy requested for $IMAGE"
