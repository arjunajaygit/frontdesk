version: 2
# Free private repository: every Dependabot PR runs the full CI/Security suites against the 2,000 included Actions
# minutes. Major-version bumps are reviewed deliberately (not auto-proposed); grouped monthly updates keep PR volume low.
# Security advisories still surface through Dependabot alerts and the weekly Security workflow.
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
