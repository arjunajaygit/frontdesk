# OPTIONAL monitoring profile (compose.prod.yaml --profile monitoring). Not part of the reviewer deployment path.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: frontdesk
    metrics_path: /metrics
    # The app's internal metrics listener (never published on the host); bearer token from a compose secret.
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ['app:9464']
        labels: { service: frontdesk }
# No Alertmanager is configured: alerts evaluate and are visible in Prometheus/Grafana, but NOTHING is delivered
# externally. Wire an Alertmanager (email/Slack/PagerDuty) before relying on notifications.
